<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站管理后台 | Home Appliance Site Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<style>
/* inline fallback: keeps the login screen usable even if external CSS fails to load */
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#F7F1E4;margin:0;color:#2E2419}
.adm-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.adm-login-card{background:#FDFAF3;border:1px solid rgba(92,75,58,.16);border-radius:22px;box-shadow:0 24px 60px rgba(60,46,31,.18);padding:40px 36px;width:100%;max-width:400px;box-sizing:border-box}
.adm-login-card h1{font-size:1.4rem;margin:0 0 6px;color:#3C2E1F}
.adm-login-card p{color:#8A7663;font-size:.9rem;margin:0 0 22px}
.logo{display:inline-flex;align-items:center;gap:10px;color:#3C2E1F;font-weight:700;font-size:1.22rem;text-decoration:none;margin-bottom:22px}
.logo .logo-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#A34A2A,#3C2E1F);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.field label{font-size:.88rem;font-weight:600;color:#3C2E1F}
.field input{font-family:inherit;font-size:.95rem;color:#2E2419;background:#FFFDF7;border:1.5px solid rgba(92,75,58,.28);border-radius:10px;padding:12px 14px;width:100%;box-sizing:border-box}
.field input:focus{outline:none;border-color:#A34A2A;box-shadow:0 0 0 3px rgba(163,74,42,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 26px;border-radius:999px;font-family:inherit;font-size:.98rem;font-weight:600;border:1.5px solid transparent;cursor:pointer}
.btn-primary{background:#A34A2A;color:#fff;border:0}
.btn-block{width:100%}
.adm-login-card .err{color:#B3261E;font-size:.85rem;margin-top:10px;display:none}
.adm-login-card .err.show{display:block}
</style>
</head>
<body class="adm-body" data-page="admin">

<!-- ============ LOGIN ============ -->
<div class="adm-login" id="login-view">
  <div class="adm-login-card">
    <a class="logo" href="index.html">
      <span class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg></span>
      <span class="js-brand">Foshan NovaHome Appliance</span>
    </a>
    <h1>网站管理后台</h1>
    <p>输入管理密码进入。默认密码 admin123，请在「系统设置」中修改。</p>
    <form id="login-form">
      <div class="field">
        <label for="adm-pass">管理密码</label>
        <input id="adm-pass" name="pass" type="password" autocomplete="current-password" placeholder="请输入密码">
      </div>
      <div class="err" id="login-err">密码错误，请重试。</div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;">登 录</button>
    </form>
    <a href="index.html" style="display:block;text-align:center;margin-top:16px;font-size:0.85rem;">← 返回前台网站</a>
  </div>
</div>

<!-- ============ SHELL ============ -->
<div class="adm-shell" id="adm-shell" style="display:none;">
  <aside class="adm-side">
    <a class="logo" href="index.html" target="_blank" rel="noopener">
      <span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg></span>
      <span>管理后台</span>
    </a>
    <div class="adm-sec-label">内容管理</div>
    <button class="adm-nav-item active" data-view="dashboard"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>仪表盘</button>
    <button class="adm-nav-item" data-view="slides"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>首页轮播</button>
    <button class="adm-nav-item" data-view="advantages"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8L12 2z"/></svg>三大优势</button>
    <button class="adm-nav-item" data-view="whyus"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3.5V11c0 5.2-3.4 9.4-8 11-4.6-1.6-8-5.8-8-11V5.5L12 2z"/><path d="M8.5 11.5l2.5 2.5 4.5-4.5"/></svg>为什么选我们</button>
    <button class="adm-nav-item" data-view="stats"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>数据统计</button>
    <button class="adm-nav-item" data-view="testimonials"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-8 8H4l2-3a8 8 0 1115-5z"/></svg>客户见证</button>

    <div class="adm-sec-label">产品管理</div>
    <button class="adm-nav-item" data-view="categories"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>产品分类</button>
    <button class="adm-nav-item" data-view="products"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>产品管理<span class="badge-count" id="nav-prod-count">0</span></button>
    <button class="adm-nav-item" data-view="aiparse"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 014 4c0 .5-.1 1-.3 1.4L19 11h-6l3.3-3.6A4 4 0 0012 2z"/><path d="M4 14h8M4 18h6M4 10h4"/><path d="M21 14l-3 2v-4l3 2z"/></svg>AI 产品录入<span class="badge-count" id="nav-draft-count">0</span></button>

    <div class="adm-sec-label">公司信息</div>
    <button class="adm-nav-item" data-view="milestones"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>发展历程</button>
    <button class="adm-nav-item" data-view="qcsteps"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3.5V11c0 5.2-3.4 9.4-8 11-4.6-1.6-8-5.8-8-11V5.5L12 2z"/><path d="M8.5 11.5l2.5 2.5 4.5-4.5"/></svg>质控流程</button>
    <button class="adm-nav-item" data-view="oem"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8L12 2z"/></svg>OEM/ODM 能力</button>
    <button class="adm-nav-item" data-view="certs"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8L12 2z"/></svg>认证展示</button>

    <div class="adm-sec-label">系统</div>
    <button class="adm-nav-item" data-view="settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.03 1.56V21a2 2 0 11-4 0v-.09A1.7 1.7 0 008.9 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.56-1.03H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 8.9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34h.01a1.7 1.7 0 001.03-1.56V3a2 2 0 114 0v.09c0 .68.4 1.29 1.03 1.56a1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87v.01c.27.62.88 1.03 1.56 1.03H21a2 2 0 110 4h-.09c-.68 0-1.29.4-1.56 1.03z"/></svg>网站设置</button>
    <button class="adm-nav-item" data-view="inquiries"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>询盘管理<span class="badge-count" id="nav-inq-count">0</span></button>

    <div class="adm-foot">
      <button class="adm-nav-item" id="btn-logout"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>退出登录</button>
      <a class="adm-nav-item" href="index.html" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>查看前台</a>
    </div>
  </aside>

  <main class="adm-main">
    <div class="adm-topbar">
      <div>
        <h1 id="view-title">仪表盘</h1>
        <div class="sub" id="view-sub"></div>
      </div>
      <div class="adm-tools" id="view-tools"></div>
    </div>
    <div class="adm-note" id="adm-note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
      <span><strong>说明：</strong>当前为前端本地存储版（数据保存在浏览器 localStorage，适合演示与内测）。正式上线建议把表单提交接到服务器（参考 <code>api/submit.php</code>）或将产品数据接入您的 ERP / CMS 后端。</span>
    </div>
    <div id="view-content"></div>
  </main>
</div>

<!-- modal -->
<div class="adm-modal-backdrop" id="adm-modal">
  <div class="adm-modal" id="adm-modal-box"></div>
</div>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
