<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>完整课件 · 金骅内部</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#1B2A4E;--navy2:#111C38;--orange:#E8862A;--green:#1D9E6E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#F2F4FA;color:#22273A;min-height:100vh;padding:24px 18px}
.card{background:#fff;border-radius:16px;padding:34px 30px;max-width:400px;width:100%;margin:8vh auto;box-shadow:0 8px 30px rgba(30,40,90,.14)}
h1{font-size:19px;color:var(--navy2);margin-bottom:6px}
p.tip{font-size:13px;color:#5A647F;margin-bottom:16px}
input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #C9D2E8;font-size:15px}
button{width:100%;margin-top:14px;padding:13px;border:none;border-radius:999px;background:linear-gradient(180deg,#FFB347,var(--orange));color:#fff;font-size:15.5px;font-weight:800;cursor:pointer}
.err{display:none;margin-top:12px;font-size:13px;color:#C0392B}
.small{font-size:11.5px;color:#8791A9;margin-top:14px;line-height:1.6}
#viewer{display:none;width:100%;max-width:980px;margin:0 auto;flex-direction:column;display:none}
#viewer .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
#viewer .top h2{min-width:0;flex:1 1 320px}
#viewer h2{font-size:17px;color:var(--navy2)}
#viewer img{width:100%;border-radius:10px;box-shadow:0 6px 24px rgba(30,40,90,.16);display:block}
#viewer .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px;flex-wrap:wrap}
#viewer .navrow>span{flex:1 1 240px;text-align:center}
@media(max-width:640px){#viewer .navrow>span{order:3;flex-basis:100%}}
#viewer .navrow button{width:auto;padding:9px 26px;border-radius:8px;background:var(--navy2)}
#viewer .pg{font-size:13.5px;color:#5A647F;font-weight:700}
#st{font-size:13px;color:#B3541E;margin-top:10px;display:none}
</style>
</head>
<body>

<div class="card" id="gate">
  <h1>完整课件 · 内部查看</h1>
  <p class="tip">仅限站点负责人。密码与 admin 后台相同。</p>
  <input id="pw" type="password" placeholder="输入密码" autocomplete="current-password">
  <button onclick="unlock()">解锁查看</button>
  <p class="err" id="err">密码不对，再试一次。</p>
  <p id="st"></p>
  <p class="small">此页 noindex、无外链。线上存储的是 AES-256-GCM 加密图（密钥=你的密码现场派生，服务器只有密文）——密码不对的人连图片内容都解不开。.pptx 原文件仍只在 10.4 现场发放。</p>
</div>

<div id="viewer">
  <div class="top">
    <h2>外贸×AI 线下课课件 v2 · 三原则版（17 页 · 含 4 页当堂实操 + AI 工具箱）</h2>
    <span class="pg" id="pg"></span>
  </div>
  <img id="slide" alt="课件页">
  <div class="navrow">
    <button onclick="go(-1)">← 上一页</button>
    <span style="font-size:12.5px;color:#8791A9">点图片翻下一页 · 刷新后需重新输密码</span>
    <button onclick="go(1)">下一页 →</button>
  </div>
</div>

<script src="js/deck-crypto.js"></script>
<script>
var N=17, cur=1;
function unlock(){
  var v=document.getElementById('pw').value;
  var st=document.getElementById('st');
  document.getElementById('err').style.display='none';
  st.style.display='block'; st.textContent='解密中…';
  DeckCrypto.decryptPage(1, v).then(function(ok){
    if(!ok){ st.style.display='none';
      document.getElementById('err').style.display='block';
      document.getElementById('slide').removeAttribute('src');
      return;
    }
    /* 密码正确：建 blob URL 会话内翻页 */
    document.getElementById('gate').style.display='none';
    document.getElementById('viewer').style.display='block';
    st.style.display='none';
    window._pass=v;
    show(1);
  });
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});
function show(n){
  cur=Math.min(N,Math.max(1,n));
  var img=document.getElementById('slide');
  img.src='img/enc/deck-'+String(cur).padStart(2,'0')+'.png.enc.loading';
  DeckCrypto.decryptPage(cur, window._pass).then(function(url){
    if(url) img.src=url;
  });
  document.getElementById('pg').textContent=cur+' / '+N;
}
function go(d){show(cur+d)}
</script>
</body>
</html>
